<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page de Contact</title>
    <!-- Intégration de Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Intégration de Font Awesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-950 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Contactez-nous</h1>
        
        <!-- Section Contact -->
        <div class="space-y-4 mb-8">
            <div class="flex items-center space-x-4">
                <div class="bg-blue-500 p-3 rounded-full text-white">
                    <i class="fas fa-phone"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-700">Téléphone</h3>
                    <p class="text-gray-600">‪+121 650 6171 44‬</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="bg-blue-500 p-3 rounded-full text-white">
                    <i class="fas fa-envelope"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-700">Email</h3>
                    <p class="text-gray-600">omar.salimdev@gmail.com</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="bg-blue-500 p-3 rounded-full text-white">
                    <i class="fas fa-map-marker-alt"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-gray-700">Adresse</h3>
                    <p class="text-gray-600">123 Rue Exemple, 75000 Beni mellal, Maroc</p>
                </div>
            </div>
        </div>
        
        <!-- Section Réseaux Sociaux -->
        <div class="border-t pt-6">
            <h2 class="text-xl font-semibold text-center text-gray-800 mb-4">Suivez-nous</h2>
            <div class="flex justify-center space-x-6">
                <a href="#" class="transform transition hover:scale-110" target="_blank">
                    <div class="bg-blue-600 p-3 rounded-full text-white">
                        <i class="fab fa-facebook-f text-xl"></i>
                    </div>
                </a>
                <a href="#" class="transform transition hover:scale-110" target="_blank">
                    <div class="bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 p-3 rounded-full text-white">
                        <i class="fab fa-instagram text-xl"></i>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
