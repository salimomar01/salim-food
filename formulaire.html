<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de paiement</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-950 min-h-screen flex items-center justify-center p-4">
    <div class="bg-amber-400 rounded-lg shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">completed your order</h1>
        
        <form id="paymentForm" class="space-y-6 ">
            <!-- Informations personnelles -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Informations personnelles</h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Nom</label>
                        <input type="text" id="lastName" name="lastName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
                        <input type="text" id="firstName" name="firstName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                </div>
            </div>
            
            <!-- Adresse -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Adresse</h2>
                
                <div class="space-y-4">
                    <div>
                        <label for="streetAddress" class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
                        <input type="text" id="streetAddress" name="streetAddress" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="postalCode" class="block text-sm font-medium text-gray-700 mb-1">Code postal</label>
                            <input type="text" id="postalCode" name="postalCode" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                        
                        <div>
                            <label for="city" class="block text-sm font-medium text-gray-700 mb-1">Ville</label>
                            <input type="text" id="city" name="city" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Méthode de paiement -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Méthode de paiement</h2>
                
                <div class="space-y-4">
                    <div class="flex items-center space-x-3">
                        <input type="radio" id="creditCard" name="paymentMethod" value="creditCard" class="h-4 w-4 text-blue-600 focus:ring-blue-500" checked>
                        <label for="creditCard" class="text-sm font-medium text-gray-700">Carte de crédit</label>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                        <input type="radio" id="paypal" name="paymentMethod" value="paypal" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="paypal" class="text-sm font-medium text-gray-700">PayPal</label>
                    </div>
                    
                    <div class="flex items-center space-x-3">
                        <input type="radio" id="bankTransfer" name="paymentMethod" value="bankTransfer" class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                        <label for="bankTransfer" class="text-sm font-medium text-gray-700">Virement bancaire</label>
                    </div>
                </div>
                
                <!-- Détails de carte de crédit (conditionnels) -->
                <div id="creditCardDetails" class="mt-4 space-y-4">
                    <div>
                        <label for="cardNumber" class="block text-sm font-medium text-gray-700 mb-1">Numéro de carte</label>
                        <input type="text" id="cardNumber" name="cardNumber" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="1234 5678 9012 3456">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="expiryDate" class="block text-sm font-medium text-gray-700 mb-1">Date d'expiration</label>
                            <input type="text" id="expiryDate" name="expiryDate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="MM/AA">
                        </div>
                        
                        <div>
                            <label for="cvv" class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                            <input type="text" id="cvv" name="cvv" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="123">
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Bouton de soumission -->
            <div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                    Valider la commande
                </button>
            </div>
        </form>
    </div>

    <script>
        // Afficher/masquer les détails de carte de crédit en fonction de la méthode de paiement sélectionnée
        document.querySelectorAll('input[name="paymentMethod"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const creditCardDetails = document.getElementById('creditCardDetails');
                if (this.value === 'creditCard') {
                    creditCardDetails.classList.remove('hidden');
                } else {
                    creditCardDetails.classList.add('hidden');
                }
            });
        });

        // Validation du formulaire
        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validation simple
            const lastName = document.getElementById('lastName').value;
            const firstName = document.getElementById('firstName').value;
            const streetAddress = document.getElementById('streetAddress').value;
            const postalCode = document.getElementById('postalCode').value;
            const city = document.getElementById('city').value;
            
            if (!lastName || !firstName || !streetAddress || !postalCode || !city) {
                alert('Veuillez remplir tous les champs obligatoires.');
                return;
            }
            
            // Validation supplémentaire pour la carte de crédit si sélectionnée
            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            if (paymentMethod === 'creditCard') {
                const cardNumber = document.getElementById('cardNumber').value;
                const expiryDate = document.getElementById('expiryDate').value;
                const cvv = document.getElementById('cvv').value;
                
                if (!cardNumber || !expiryDate || !cvv) {
                    alert('Veuillez remplir tous les détails de votre carte de crédit.');
                    return;
                }
            }
            
            alert('Formulaire soumis avec succès !');
            // Ici, vous pourriez envoyer les données à un serveur
        });
    </script>
</body>
</html>
